services:
  - type: web
    name: resqai-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: SENTINELGRID
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resqai-postgres
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: CELERY_BROKER_URL
        value: ""
      - key: CELERY_RESULT_BACKEND
        value: ""
      - key: S3_BUCKET_NAME
        value: sentinelgrid-evidence
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ADAPTER_MODE
        value: live
      - key: AI_PRELOAD_ON_STARTUP
        value: "false"
      - key: AI_INLINE_OUTBOX_POLL_SECONDS
        value: "2.0"
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: CORS_ORIGINS
        value: '["https://res-q-ai-coral.vercel.app"]'

databases:
  - name: resqai-postgres
    databaseName: sentinelgrid_db
    user: sentinel_user
    plan: free
    region: singapore
