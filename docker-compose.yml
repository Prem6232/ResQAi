version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentinelgrid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelgrid_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password_dev_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinelgrid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Message Broker, Cache, & Outbox lock)
  redis:
    image: redis:7-alpine
    container_name: sentinelgrid_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MinIO (S3-compatible private object storage for audio/images)
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: sentinelgrid_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. FastAPI Backend API
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: sentinelgrid_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel_user:sentinel_password_dev_123@postgres:5432/sentinelgrid_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword123
      S3_BUCKET_NAME: sentinelgrid-evidence
      JWT_SECRET: dev_jwt_secret_sentinelgrid_supersecure_32chars_min
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
