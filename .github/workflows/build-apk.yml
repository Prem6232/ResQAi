name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Make Gradlew Executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/ResQAi-mobile.apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResQAi-mobile-apk
          path: release-artifacts/ResQAi-mobile.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: 'ResQAi Mobile APK (Latest Auto-Build)'
          body: |
            ## ResQAi Mobile Android Build 📱

            This release is automatically compiled and published by GitHub Actions CI/CD on every update to the mobile app codebase.

            - **File:** `ResQAi-mobile.apk`
            - **Branch:** `main`
            - **Commit:** ${{ github.sha }}
            - **Built on:** ${{ github.event.head_commit.timestamp || github.run_id }}

            ### Installation:
            1. Download `ResQAi-mobile.apk` to your Android device.
            2. Tap the file in your downloads / notification tray.
            3. If prompted, allow "Install unknown apps" in Settings.
            4. Launch ResQAi and connect.
          draft: false
          prerelease: false
          files: |
            release-artifacts/ResQAi-mobile.apk
            release-artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
